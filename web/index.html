<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Skill Atlas</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f6f8; color: #20232a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { background: #fff; border-bottom: 1px solid #dfe2e7; padding: 28px max(24px, calc((100% - 1180px) / 2)); }
      h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.025em; }
      .subtitle { margin: 0; color: #646b76; font-size: 14px; }
      main { max-width: 1180px; padding: 28px 24px 48px; margin: auto; }
      form { display: flex; gap: 10px; }
      input { flex: 1; min-width: 0; border: 1px solid #c9cdd5; border-radius: 8px; padding: 12px 14px; font: inherit; background: #fff; color: inherit; }
      button { font: inherit; cursor: pointer; }
      form button { background: #2758d8; color: white; border: 0; border-radius: 8px; padding: 0 20px; font-weight: 650; }
      form button:disabled { opacity: .65; cursor: wait; }
      #status { min-height: 24px; margin: 14px 0; color: #646b76; font-size: 14px; }
      #status.error { color: #b42318; }
      .summary { display: flex; align-items: baseline; gap: 12px; margin: 22px 0 14px; }
      .summary h2 { font-size: 18px; margin: 0; }
      .summary span { color: #646b76; font-size: 14px; }
      .warnings { color: #7a4d00; background: #fff5d9; border: 1px solid #f0d99c; border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; font-size: 13px; }
      .workspace { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
      .panel { background: #fff; border: 1px solid #dfe2e7; border-radius: 10px; overflow: hidden; }
      .skill-list { max-height: 70vh; overflow: auto; }
      .skill { width: 100%; display: block; text-align: left; padding: 14px 16px; border: 0; border-bottom: 1px solid #eceef1; background: transparent; color: inherit; }
      .skill:last-child { border-bottom: 0; }
      .skill:hover { background: #f6f7fa; }
      .skill[aria-current="true"] { background: #eef2ff; box-shadow: inset 3px 0 #2758d8; }
      .skill-name { display: block; font-size: 14px; font-weight: 650; margin-bottom: 5px; }
      .skill-description, .skill-path { display: block; color: #646b76; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
      .skill-path { margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .empty { color: #737985; padding: 22px; margin: 0; font-size: 14px; }
      .detail-head { padding: 15px 18px; border-bottom: 1px solid #eceef1; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .detail-head h2 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
      .detail-head a { color: #2758d8; font-size: 13px; white-space: nowrap; }
      pre { margin: 0; padding: 20px; min-height: 260px; max-height: 70vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
      @media (max-width: 720px) { header { padding: 22px 20px; } main { padding: 22px 16px 36px; } form { flex-direction: column; } form button { min-height: 44px; } .workspace { grid-template-columns: 1fr; } .skill-list { max-height: 35vh; } pre { max-height: 55vh; } }
      @media (prefers-color-scheme: dark) {
        :root { background: #15171b; color: #e7e9ed; }
        header, .panel, input { background: #202329; }
        header, .panel, input { border-color: #3a3f48; }
        .skill { border-color: #343942; }
        .skill:hover { background: #292d35; }
        .skill[aria-current="true"] { background: #252f4b; }
        .warnings { background: #322a18; border-color: #62502a; color: #f5d994; }
        .detail-head { border-color: #343942; }
        .detail-head a { color: #91aaff; }
        form button { background: #456de0; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Skill Atlas</h1>
      <p class="subtitle">Browse the project skills and their SKILL.md files.</p>
    </header>
    <main>
      <form id="scan-form">
        <input id="repository-url" name="url" type="text" autocomplete="url" spellcheck="false" placeholder="https://github.com/owner/repository" aria-label="GitHub repository URL" required>
        <button id="scan-button" type="submit">Find skills</button>
      </form>
      <p id="status" role="status" aria-live="polite">Enter a GitHub repository URL to get started.</p>
      <section id="results" hidden>
        <div class="summary"><h2 id="repository-name"></h2><span id="skill-count"></span></div>
        <div id="warnings" class="warnings" hidden></div>
        <div class="workspace">
          <section class="panel" aria-label="Repository skills">
            <div id="skill-list" class="skill-list"></div>
          </section>
          <section class="panel" aria-label="Selected skill file">
            <div class="detail-head"><h2 id="file-name">SKILL.md</h2><a id="file-link" target="_blank" rel="noreferrer" hidden>Open on GitHub ↗</a></div>
            <pre id="file-content">Select a skill to view its SKILL.md file.</pre>
          </section>
        </div>
      </section>
    </main>
    <script>
      const form = document.querySelector('#scan-form');
      const field = document.querySelector('#repository-url');
      const button = document.querySelector('#scan-button');
      const status = document.querySelector('#status');
      const results = document.querySelector('#results');
      const list = document.querySelector('#skill-list');
      const content = document.querySelector('#file-content');
      const fileName = document.querySelector('#file-name');
      const fileLink = document.querySelector('#file-link');
      let skills = [];

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const repositoryUrl = field.value.trim();
        if (!repositoryUrl) return;
        button.disabled = true;
        results.hidden = true;
        status.className = '';
        status.textContent = 'Scanning repository…';
        try {
          const response = await fetch(`/api/scan?url=${encodeURIComponent(repositoryUrl)}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not scan this repository.');
          skills = data.skills;
          document.querySelector('#repository-name').textContent = data.repository.id;
          document.querySelector('#skill-count').textContent = `${skills.length} ${skills.length === 1 ? 'skill' : 'skills'}`;
          showWarnings(data.warnings);
          renderSkills();
          results.hidden = false;
          status.textContent = skills.length ? 'Select a skill to read its SKILL.md.' : 'No project skills were found in this repository.';
        } catch (error) {
          status.className = 'error';
          status.textContent = error instanceof Error ? error.message : String(error);
        } finally {
          button.disabled = false;
        }
      });

      function showWarnings(warnings) {
        const box = document.querySelector('#warnings');
        box.replaceChildren();
        if (!warnings.length) { box.hidden = true; return; }
        const heading = document.createElement('strong');
        heading.textContent = 'Scan notes';
        const items = document.createElement('ul');
        for (const warning of warnings) {
          const item = document.createElement('li');
          item.textContent = warning;
          items.append(item);
        }
        box.append(heading, items);
        box.hidden = false;
      }

      function renderSkills() {
        list.replaceChildren();
        if (!skills.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No skills found.';
          list.append(empty);
          content.textContent = 'This repository has no project SKILL.md files.';
          fileName.textContent = 'SKILL.md';
          fileLink.hidden = true;
          return;
        }
        skills.forEach((skill, index) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'skill';
          item.setAttribute('aria-current', index === 0 ? 'true' : 'false');
          const name = document.createElement('span');
          name.className = 'skill-name';
          name.textContent = skill.name;
          item.append(name);
          if (skill.description) {
            const description = document.createElement('span');
            description.className = 'skill-description';
            description.textContent = skill.description;
            item.append(description);
          }
          const path = document.createElement('span');
          path.className = 'skill-path';
          path.textContent = skill.path;
          item.append(path);
          if (skill.copies.length) {
            const copies = document.createElement('span');
            copies.className = 'skill-description';
            copies.textContent = `Also in ${skill.copies.join(', ')}`;
            item.append(copies);
          }
          item.addEventListener('click', () => selectSkill(index));
          list.append(item);
        });
        selectSkill(0);
      }

      function selectSkill(index) {
        const skill = skills[index];
        for (const [itemIndex, item] of [...list.querySelectorAll('.skill')].entries()) {
          item.setAttribute('aria-current', itemIndex === index ? 'true' : 'false');
        }
        fileName.textContent = skill.path;
        content.textContent = skill.content;
        fileLink.href = skill.link;
        fileLink.hidden = false;
      }
    </script>
  </body>
</html>
